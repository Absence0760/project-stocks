# The repo's real CI. Its `CI gate` job is the single required status check
# on `main`; every other job here feeds into it, so adding a job means adding
# it to that job's `needs` list and nothing else.
#
# `ci-gate-docs.yml` is the companion for the inverse path set: this workflow
# is skipped wholesale on docs-only / *.md / .claude-only PRs (the
# `paths-ignore` below), which would otherwise leave the required "CI gate"
# context pending forever. Keep that file's `paths` the exact inverse of the
# `paths-ignore` here — if one moves, move the other in the same change.
name: CI

on:
  push:
    # Only main. A push to a feature branch is validated by its PR; a push
    # run's job is to re-validate main itself after a merge.
    branches: [main]
  # Deliberately NOT filtered to `branches: [main]` — a stacked PR based on
  # another feature branch matches no branch filter and would run nothing,
  # reporting green while entirely unscanned.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned, not `channel: stable`. project-running was turned red by an
  # unrelated Flutter release publishing new lints mid-PR; a floating SDK
  # makes an upstream release arrive as a random failure rather than a
  # deliberate bump. Keep in step with project-running's pin.
  FLUTTER_VERSION: "3.47.0"
  # The Supabase CLI version the local stack + pgTAP suite are validated
  # against. Pinned for the same reason as Flutter.
  SUPABASE_CLI_VERSION: "2.84.2"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------
  # Structure guards. Pure static file reads — no toolchain, no database,
  # so they fail in seconds rather than after a full stack boot.
  # ---------------------------------------------------------------------
  guards:
    name: Structure guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Root package.json scripts resolve
        run: node scripts/check_root_scripts.mjs
      - name: CHECK constraints match their TypeScript unions
        run: node scripts/check_constraint_unions.mjs

  # ---------------------------------------------------------------------
  # Edge functions: typecheck + Deno unit tests. No database — these are
  # the pure-helper tests, so they stay fast and independent of the stack.
  # ---------------------------------------------------------------------
  backend-unit:
    name: Edge Function tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Restore the module cache keyed on the committed lockfile so the
      # common case (lockfile unchanged) never touches the network.
      - name: Cache Deno dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('apps/backend/deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      # Pre-fetch every test file's deps so a transient CDN 5xx surfaces
      # here — retried, and named — instead of failing opaquely mid-import
      # inside a test run.
      - name: Warm the Deno dependency cache
        working-directory: apps/backend
        run: |
          files=$(find supabase/functions -name '*.test.ts' | sort)
          for attempt in 1 2 3; do
            if deno cache --no-check $files; then
              echo "deno deps cached"
              exit 0
            fi
            echo "::warning::deno cache attempt $attempt failed (CDN transient?); retrying"
            sleep $((attempt * 5))
          done
          echo "::error::deno dependency fetch failed after 3 attempts"
          exit 1
      - name: Typecheck edge functions
        working-directory: apps/backend
        run: deno check supabase/functions/
      - name: Run edge function unit tests
        working-directory: apps/backend
        run: deno test --quiet supabase/functions/

  # ---------------------------------------------------------------------
  # pgTAP against the real local stack — the only job that boots Supabase.
  # ---------------------------------------------------------------------
  backend-db:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    # Steady-state is a few minutes, but the stack-start retry can spend
    # two attempts on a slow image pull. See the composite action.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Retry + port-cleanup rationale lives in the composite action.
      - name: Start local Supabase stack
        uses: ./.github/actions/start-supabase
      - name: Run pgTAP suite
        working-directory: apps/backend
        run: supabase test db --local

  # ---------------------------------------------------------------------
  # Web: typecheck, unit tests, production build.
  # ---------------------------------------------------------------------
  web:
    name: Web (check, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` — the action reads it from the root package.json's
      # `packageManager` field, so the pin lives in exactly one place.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run check:web
      - name: Unit tests
        run: pnpm run test:web
      - name: Production build
        run: pnpm run build:web

  # ---------------------------------------------------------------------
  # Mobile: analyzer, formatter and widget tests.
  # ---------------------------------------------------------------------
  mobile:
    name: Mobile (analyze, format, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.1
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # pnpm + node only so the steps below can go through the root scripts.
      # No `pnpm install` — those scripts shell straight out to Flutter and
      # need no node_modules.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve packages
        working-directory: apps/mobile
        run: flutter pub get
      # `check:mobile` runs `flutter analyze --no-pub` + a format check;
      # `test:mobile` runs the widget tests. Both go through the root
      # scripts so CI and a laptop run the identical command.
      - name: Analyze and format-check
        run: pnpm run check:mobile
      - name: Widget tests
        run: pnpm run test:mobile

  # ---------------------------------------------------------------------
  # The gate. This job's name is the single required status check on main;
  # it passes only when every upstream job succeeded or was skipped.
  # ---------------------------------------------------------------------
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - guards
      - backend-unit
      - backend-db
      - web
      - mobile
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
